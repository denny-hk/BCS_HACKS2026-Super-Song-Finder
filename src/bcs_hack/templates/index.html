<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Finder</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            max-width: 1100px;
            margin: 40px auto;
            padding: 0 20px;
            color: #222;
            background: #fafafa;
        }

        h1 {
            margin-bottom: 8px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 24px;
        }

        .search-form {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
        }

        input, button {
            font: inherit;
            padding: 11px 13px;
            border-radius: 7px;
        }

        input {
            border: 1px solid #ccc;
            min-width: 0;
        }

        #query {
            flex: 1;
        }

        #market {
            width: 110px;
        }

        button {
            border: none;
            background: #222;
            color: white;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.5;
            cursor: wait;
        }

        .platform {
            margin-top: 32px;
        }

        .platform h2 {
            border-bottom: 1px solid #ddd;
            padding-bottom: 10px;
        }

        .song-card {
            background: white;
            border: 1px solid #e5e5e5;
            border-radius: 10px;
            padding: 15px;
            margin: 12px 0;
        }

        .song-row {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .thumbnail {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border-radius: 6px;
            background: #eee;
            flex-shrink: 0;
        }

        .song-info {
            flex: 1;
            min-width: 0;
        }

        .song-title {
            font-weight: bold;
            overflow-wrap: anywhere;
        }

        .song-meta {
            color: #666;
            font-size: 14px;
            margin-top: 6px;
            overflow-wrap: anywhere;
        }

        .song-actions {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .song-actions a {
            text-decoration: none;
            color: #0759b5;
            font-size: 14px;
        }

        .secondary-button {
            background: #e9edf3;
            color: #222;
        }

        .region-results {
            margin-top: 15px;
            padding: 14px;
            background: #f5f7fa;
            border-radius: 7px;
            overflow-wrap: anywhere;
        }

        .region-list {
            display: flex;
            flex-wrap: wrap;
            gap: 7px;
        }

        .region {
            background: #dff5e5;
            color: #185c30;
            padding: 6px 9px;
            border-radius: 5px;
            font-size: 13px;
        }

        .not-found {
            background: #eee;
            color: #555;
            padding: 6px 9px;
            border-radius: 5px;
            font-size: 13px;
        }

        .error {
            color: #b42318;
        }

        .muted {
            color: #777;
            font-size: 14px;
        }

        .loading {
            color: #555;
            padding: 12px 0;
        }

        @media (max-width: 600px) {
            body {
                margin-top: 20px;
                padding: 0 12px;
            }

            .search-form {
                flex-wrap: wrap;
            }

            #query {
                flex-basis: 100%;
            }

            #market {
                flex: 1;
            }

            .song-row {
                align-items: flex-start;
                flex-wrap: wrap;
            }

            .thumbnail {
                width: 65px;
                height: 65px;
            }

            .song-info {
                width: calc(100% - 85px);
            }

            .song-actions {
                width: 100%;
                flex-direction: row;
                flex-wrap: wrap;
            }
        }
    </style>
</head>

<body>
    <h1>Music Finder</h1>
    <p class="subtitle">
        Search for music across Spotify, YouTube and Apple Music.
    </p>

    <form id="searchForm" class="search-form">
        <input
            id="query"
            name="query"
            type="text"
            placeholder="Enter a song name or artist"
            required
        >

        <input
            id="market"
            name="market"
            type="text"
            maxlength="2"
            placeholder="Country"
            value="ca"
            title="Two-letter country code, e.g. ca, us, jp"
        >

        <button id="searchButton" type="submit">Search</button>
    </form>

    <p class="muted">
        Country code selects the Spotify market and Apple/iTunes search storefront.
    </p>

    <div id="status" aria-live="polite"></div>

    <section class="platform">
        <h2>Spotify</h2>
        <div id="spotifyResults"></div>
    </section>

    <section class="platform">
        <h2>YouTube</h2>
        <div id="youtubeResults"></div>
    </section>

    <section class="platform">
        <h2>Apple Music</h2>
        <div id="appleResults"></div>
    </section>

    <script>
        const form = document.getElementById("searchForm");
        const searchButton = document.getElementById("searchButton");
        const statusDiv = document.getElementById("status");

        const spotifyDiv = document.getElementById("spotifyResults");
        const youtubeDiv = document.getElementById("youtubeResults");
        const appleDiv = document.getElementById("appleResults");

        function makeElement(tag, className, text) {
            const element = document.createElement(tag);

            if (className) {
                element.className = className;
            }

            if (text !== undefined && text !== null) {
                element.textContent = text;
            }

            return element;
        }

        function makeLink(url, label) {
            if (!url) {
                return null;
            }

            const link = makeElement("a", "", label);
            link.href = url;
            link.target = "_blank";
            link.rel = "noopener noreferrer";

            return link;
        }

        function showMessage(container, message, isError = false) {
            container.replaceChildren();

            container.appendChild(
                makeElement(
                    "p",
                    isError ? "error" : "muted",
                    message
                )
            );
        }

        function getErrorMessage(data) {
            if (data && data.error) {
                return data.error;
            }

            return "The request failed. Please try again.";
        }

        function createSongCard(song, platform) {
            const card = makeElement("article", "song-card");
            const row = makeElement("div", "song-row");
            const info = makeElement("div", "song-info");
            const actions = makeElement("div", "song-actions");

            if (song.thumbnail) {
                const image = makeElement("img", "thumbnail");
                image.src = song.thumbnail;
                image.alt = "Album or video artwork";
                image.loading = "lazy";
                image.onerror = () => image.remove();

                row.appendChild(image);
            }

            info.appendChild(
                makeElement("div", "song-title", song.title || "Untitled")
            );

            if (song.artist) {
                info.appendChild(
                    makeElement("div", "song-meta", song.artist)
                );
            } else if (song.channel) {
                info.appendChild(
                    makeElement("div", "song-meta", song.channel)
                );
            }

            if (song.album) {
                info.appendChild(
                    makeElement("div", "song-meta", song.album)
                );
            }

            if (platform === "spotify" && song.restrictions) {
                info.appendChild(
                    makeElement("div", "song-meta", song.restrictions)
                );
            }

            row.appendChild(info);

            const url =
                platform === "spotify"
                    ? song.spotifyUrl
                    : platform === "youtube"
                        ? song.youtubeUrl
                        : song.appleMusicUrl;

            const link = makeLink(url, "Open on " + (
                platform === "spotify"
                    ? "Spotify"
                    : platform === "youtube"
                        ? "YouTube"
                        : "Apple"
            ));

            if (link) {
                actions.appendChild(link);
            }

            if (platform === "apple_music") {
                const checkButton = makeElement(
                    "button",
                    "secondary-button",
                    "Check regions"
                );

                checkButton.type = "button";

                const regionDiv = makeElement("div", "region-results");
                regionDiv.hidden = true;

                checkButton.addEventListener("click", async () => {
                    if (!regionDiv.hidden &&
                        checkButton.dataset.checked === "true") {
                        regionDiv.hidden = true;
                        checkButton.textContent = "Check regions";
                        return;
                    }

                    regionDiv.hidden = false;
                    checkButton.disabled = true;
                    checkButton.textContent = "Checking...";
                    showMessage(regionDiv, "Checking Apple/iTunes catalogs...");

                    try {
                        const response = await fetch("/api/apple/regions", {
                            method: "POST",
                            headers: {
                                "Content-Type": "application/json"
                            },
                            body: JSON.stringify({
                                trackName: song.title,
                                artistName: song.artist
                            })
                        });

                        const data = await response.json();

                        if (!response.ok || data.error) {
                            throw new Error(getErrorMessage(data));
                        }

                        renderAppleRegions(regionDiv, data.results || []);
                        checkButton.dataset.checked = "true";
                        checkButton.textContent = "Hide regions";
                    } catch (error) {
                        showMessage(
                            regionDiv,
                            error.message || "Region lookup failed.",
                            true
                        );
                    } finally {
                        checkButton.disabled = false;
                        if (checkButton.dataset.checked !== "true") {
                            checkButton.textContent = "Check regions";
                        }
                    }
                });

                actions.appendChild(checkButton);
                card.appendChild(row);
                card.appendChild(actions);
                card.appendChild(regionDiv);
                return card;
            }

            card.appendChild(row);
            card.appendChild(actions);

            return card;
        }

        function renderAppleRegions(container, regions) {
            container.replaceChildren();

            const found = regions.filter(
                item => item.status === "found"
            );

            const missing = regions.filter(
                item => item.status === "not_found"
            );

            const errors = regions.filter(
                item => item.status === "error"
            );

            container.appendChild(
                makeElement(
                    "strong",
                    "",
                    `Found matches in ${found.length} of ${regions.length} checked storefronts`
                )
            );

            container.appendChild(
                makeElement("p", "", "Found in catalog:")
            );

            const foundList = makeElement("div", "region-list");

            found.forEach(item => {
                const name = item.countryName || item.country;
                const tag = makeElement("span", "region", name);

                if (item.match && item.match.appleMusicUrl) {
                    const link = makeLink(
                        item.match.appleMusicUrl,
                        "Open"
                    );

                    tag.appendChild(document.createTextNode(" "));
                    tag.appendChild(link);
                }

                foundList.appendChild(tag);
            });

            if (!found.length) {
                foundList.appendChild(
                    makeElement("span", "muted", "No matches found.")
                );
            }

            container.appendChild(foundList);

            container.appendChild(
                makeElement("p", "", "No match found:")
            );

            const missingList = makeElement("div", "region-list");

            missing.forEach(item => {
                missingList.appendChild(
                    makeElement(
                        "span",
                        "not-found",
                        item.countryName || item.country
                    )
                );
            });

            if (!missing.length) {
                missingList.appendChild(
                    makeElement("span", "muted", "None.")
                );
            }

            container.appendChild(missingList);

            if (errors.length) {
                container.appendChild(
                    makeElement(
                        "p",
                        "error",
                        `${errors.length} storefront checks failed. Their availability is unknown.`
                    )
                );
            }

            container.appendChild(
                makeElement(
                    "p",
                    "muted",
                    "A catalog match does not guarantee that the song can be played."
                )
            );
        }

        function renderResults(container, data, platform) {
            container.replaceChildren();

            if (data && !Array.isArray(data) && data.error) {
                showMessage(container, data.error, true);
                return;
            }

            if (!Array.isArray(data) || data.length === 0) {
                showMessage(container, "No results found.");
                return;
            }

            data.forEach(song => {
                container.appendChild(createSongCard(song, platform));
            });
        }

        form.addEventListener("submit", async event => {
            event.preventDefault();

            const query = document.getElementById("query").value.trim();
            const market = document.getElementById("market").value
                .trim()
                .toLowerCase();

            if (!query) {
                return;
            }

            searchButton.disabled = true;
            statusDiv.textContent = "Searching all platforms...";

            showMessage(spotifyDiv, "Searching...");
            showMessage(youtubeDiv, "Searching...");
            showMessage(appleDiv, "Searching...");

            try {
                const formData = new URLSearchParams();
                formData.append("query", query);
                formData.append("market", market);

                const response = await fetch("/search", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/x-www-form-urlencoded"
                    },
                    body: formData.toString()
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(getErrorMessage(data));
                }

                renderResults(spotifyDiv, data.spotify, "spotify");
                renderResults(youtubeDiv, data.youtube, "youtube");
                renderResults(appleDiv, data.apple_music, "apple_music");

                statusDiv.textContent = "Search complete.";
            } catch (error) {
                statusDiv.textContent =
                    error.message || "Search failed. Please try again.";
            } finally {
                searchButton.disabled = false;
            }
        });
    </script>
</body>
</html>
