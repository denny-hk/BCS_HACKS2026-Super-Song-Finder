<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Song Availability Checker</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 900px; margin: 50px auto; padding: 20px; }
        input { width: 70%; padding: 10px; font-size: 16px; margin-bottom: 10px; display: block; }
        button { padding: 10px 20px; font-size: 16px; }
        .results-container { display: flex; gap: 20px; margin-top: 20px; flex-wrap: wrap; }
        .platform-card { flex: 1; min-width: 350px; padding: 15px; border: 1px solid #ddd; border-radius: 8px; background: #fafafa; }
        img { max-width: 100%; height: auto; border-radius: 4px; }
        .error { color: red; }
    </style>
</head>
<body>
    <h2>Song Availability Checker</h2>
    <input type="text" id="query" placeholder="Enter Artist & Song Name...">
    <input type="text" id="market" placeholder="Market (optional, e.g. US)">
    <button onclick="checkSong()">Search</button>

    <div class="results-container" id="result"></div>

    <script>
        async function checkSong() {
            const query = document.getElementById("query").value;
            const market = document.getElementById("market").value;
            const resultDiv = document.getElementById("result");
            resultDiv.innerHTML = "<p>Searching platforms...</p>";

            const response = await fetch("/search", {
                method: "POST",
                headers: { "Content-Type": "application/x-www-form-urlencoded; charset=UTF-8" },
                body: new URLSearchParams({ query, market }).toString()
            });
            const data = await response.json();

            // Handle general root error if any
            if (data.error && !data.spotify && !data.youtube) {
                resultDiv.innerHTML = `<p class="error">${data.error}</p>`;
                return;
            }

            let htmlContent = "";

            // --- SPOTIFY CARD ---
            htmlContent += `<div class="platform-card"><h3>Spotify</h3>`;
            if (data.spotify && !data.spotify.error) {
                const s = data.spotify;
                htmlContent += `
                    <h4>${s.title}</h4>
                    <p><strong>Artist:</strong> ${s.artist}</p>
                    <p><strong>Album:</strong> ${s.album || "Unknown"}</p>
                    ${s.thumbnail ? `<img src="${s.thumbnail}" alt="Album art" />` : ""}
                    <p><strong>Regional availability:</strong> ${s.restrictions}</p>
                    ${s.spotifyUrl ? `<p><a href="${s.spotifyUrl}" target="_blank" rel="noopener">Open in Spotify</a></p>` : ""}
                    ${s.previewUrl ? `<audio controls src="${s.previewUrl}"></audio>` : ""}
                `;
            } else {
                htmlContent += `<p class="error">${data.spotify?.error || "Not found on Spotify"}</p>`;
            }
            htmlContent += `</div>`;

            // --- YOUTUBE CARD ---
            htmlContent += `<div class="platform-card"><h3>YouTube</h3>`;
            if (data.youtube && !data.youtube.error) {
                const y = data.youtube;
                htmlContent += `
                    <h4>${y.title}</h4>
                    <p><strong>Channel:</strong> ${y.channel}</p>
                    ${y.thumbnail ? `<img src="${y.thumbnail}" alt="Video thumbnail" />` : ""}
                    <p><strong>Restrictions:</strong> ${typeof y.restrictions === 'object' ? JSON.stringify(y.restrictions, null, 2) : y.restrictions}</p>
                    ${y.youtubeUrl ? `<p><a href="${y.youtubeUrl}" target="_blank" rel="noopener">Watch on YouTube</a></p>` : ""}
                `;
            } else {
                htmlContent += `<p class="error">${data.youtube?.error || "Not found on YouTube"}</p>`;
            }
            htmlContent += `</div>`;

            resultDiv.innerHTML = htmlContent;
        }
    </script>
</body>
</html>
